packages:
  - "plugins/alps-writer"

allowBuilds:
  esbuild: true

# Keep vulnerable transitive releases below their first patched versions.
# Each selector applies only to the affected range, so a parent dependency can
# adopt a newer compatible release without changing this file.
overrides:
  "brace-expansion@>=4.0.0 <5.0.9": "5.0.9"
  "fast-uri@>=3.0.0 <3.1.5": "3.1.5"
  "hono@<4.12.34": "4.12.34"
  "ip-address@>=10.1.1 <10.3.1": "10.3.1"
  "@hono/node-server@<2.0.5": ">=2.0.5"
